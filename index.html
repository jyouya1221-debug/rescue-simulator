<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面接シミュレーター</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--surface:#fff;--surface1:#f9f8f5;--border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.16);--text:#1a1a18;--sub:#5f5e5a;--muted:#888780;--accent:#2563eb;--accent-bg:#eff6ff;--accent-text:#1d4ed8;--accent-border:#bfdbfe;--ok-bg:#f0fdf4;--ok-text:#166534;--warn-bg:#fffbeb;--warn-text:#92400e;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1f1f1d;--surface1:#2a2a28;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.15);--text:#f0ede6;--sub:#a8a69f;--muted:#5a5955;--accent:#3b82f6;--accent-bg:#1e3a5f;--accent-text:#93c5fd;--accent-border:#1e40af;--ok-bg:#052e16;--ok-text:#86efac;--warn-bg:#3b2800;--warn-text:#fcd34d}}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.site-desc{font-size:13px;color:var(--sub);margin-bottom:1.5rem;line-height:1.6}
.scen-tabs{display:flex;gap:4px;background:var(--surface1);border:0.5px solid var(--border);border-radius:var(--r);padding:4px;width:fit-content;margin-bottom:1.25rem;flex-wrap:wrap}
.stab{padding:6px 14px;border-radius:6px;border:none;background:transparent;font-size:13px;color:var(--sub);cursor:pointer}
.stab:hover{color:var(--text)}
.stab.active{background:var(--surface);color:var(--text);border:0.5px solid var(--border-strong)}
.scen-bar{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.si{font-size:22px;flex-shrink:0}
.sb{flex:1}
.sb h2{font-size:14px;font-weight:500;margin-bottom:3px}
.sb p{font-size:12px;color:var(--sub);line-height:1.5}
.ss{flex-shrink:0;text-align:right}
.ss-l{font-size:11px;color:var(--muted)}
.ss-v{font-size:22px;font-weight:500;color:var(--accent-text)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:1.25rem}
.pcard{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:12px}
.pcard-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pav{font-size:26px;flex-shrink:0}
.pinfo{flex:1}
.pname{font-size:13px;font-weight:500;margin-bottom:2px}
.pbasic{font-size:11px;color:var(--sub)}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;margin-left:4px}
.tag-a{background:var(--ok-bg);color:var(--ok-text)}
.tag-b{background:var(--accent-bg);color:var(--accent-text)}
.tag-c{background:var(--warn-bg);color:var(--warn-text)}
.tag-d{background:#fef2f2;color:#b91c1c}
.del-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);padding:2px;flex-shrink:0}
.del-btn:hover{color:#b91c1c}
.field-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.field-hint{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.5;font-style:italic}
.pcard textarea{width:100%;font-size:12px;padding:8px;border-radius:var(--r);border:0.5px solid var(--border-strong);background:var(--surface1);color:var(--text);font-family:inherit;resize:vertical;min-height:90px;line-height:1.6}
.pcard textarea:focus{outline:none;border-color:var(--accent)}
.add-card{background:var(--surface1);border:0.5px dashed var(--border-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:140px;gap:6px;color:var(--muted);font-size:12px}
.add-card:hover{border-color:var(--accent);color:var(--accent-text)}
.hint{font-size:12px;color:var(--accent-text);padding:10px 14px;background:var(--accent-bg);border-radius:var(--r);border:0.5px solid var(--accent-border);margin-bottom:1rem;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 22px;border-radius:var(--r);border:0.5px solid var(--border-strong);background:transparent;color:var(--text);font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface1)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.btn.primary:hover{opacity:.88}
</style>
</head>
<body>
<div class="wrap">
  <h1>面接シミュレーター</h1>
  <p class="site-desc">年齢・性別・学歴は自動生成。テキスト欄にその人の人生・生活・エピソードを書くと、AIが面接官として「何を聞くか」「何を評価するか」を考えて採用判断します。</p>
  <div class="scen-tabs" id="scenTabs"></div>
  <div class="scen-bar">
    <div class="si" id="si"></div>
    <div class="sb"><h2 id="st"></h2><p id="sd"></p></div>
    <div class="ss"><div class="ss-l">採用枠</div><div class="ss-v" id="sv"></div></div>
  </div>
  <div class="pgrid" id="pgrid"></div>
  <div class="hint">ボタンを押すとclaude.aiが新しいタブで開き、AIが面接・採用判断をします。claude.aiのアカウントが必要です。</div>
  <div class="actions">
    <button class="btn primary" id="judgeBtn">AIに面接・採用判断させる →</button>
    <button class="btn" id="regenBtn">応募者を再生成</button>
  </div>
</div>
<script>
const scenarios=[
  {id:'venture',icon:'🚀',label:'ベンチャー',title:'ベンチャー企業・エンジニア採用',desc:'急成長中のスタートアップ。自走力と技術力が求められる。カルチャーフィットも重視。',slots:1,total:4},
  {id:'large',icon:'🏢',label:'大手企業',title:'大手企業・総合職採用',desc:'創業100年の老舗大企業。安定志向で長期育成型。チームワークとポテンシャルを重視。',slots:2,total:6},
  {id:'global',icon:'🌐',label:'外資系',title:'外資系企業・即戦力採用',desc:'グローバル展開する外資系企業。即戦力と英語力が必須。成果主義の文化。',slots:1,total:5},
];
const lastNames=['山田','鈴木','田中','佐藤','伊藤','渡辺','中村','小林','加藤','吉田','高橋','松本','斎藤','小川','林','石井','木村','清水'];
const firstNamesM=['太郎','健一','誠','拓海','龍也','大輔','翔','賢司','蓮','颯'];
const firstNamesF=['花子','美咲','さくら','葵','奈々','愛','ゆい','陽菜','彩','莉子'];
const schools=[{l:'東大・京大',c:'tag-a'},{l:'早慶・上智',c:'tag-a'},{l:'MARCH',c:'tag-b'},{l:'地方国立',c:'tag-b'},{l:'私立中堅',c:'tag-c'},{l:'専門・短大',c:'tag-c'},{l:'高卒',c:'tag-d'}];
const avM=['👨','👨‍💼','👨‍💻','👨‍🎓'];
const avF=['👩','👩‍💼','👩‍💻','👩‍🎓'];
let scen=0,people=[];
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function genPerson(id){
  const g=Math.random()>.5?'男':'女';
  const age=ri(22,45);
  const school=schools[ri(0,schools.length-1)];
  const name=pick(lastNames)+' '+(g==='男'?pick(firstNamesM):pick(firstNamesF));
  const av=g==='男'?pick(avM):pick(avF);
  return {id,name,g,age,school,av,profile:''};
}
function renderTabs(){
  document.getElementById('scenTabs').innerHTML=scenarios.map((s,i)=>
    `<button class="stab${i===scen?' active':''}" onclick="sw(${i})">${s.icon} ${s.label}</button>`).join('');
}
function sw(i){scen=i;renderTabs();reset();}
function reset(){
  const s=scenarios[scen];
  people=Array.from({length:s.total},(_,i)=>genPerson(i));
  document.getElementById('si').textContent=s.icon;
  document.getElementById('st').textContent=s.title;
  document.getElementById('sd').textContent=s.desc;
  document.getElementById('sv').textContent=s.slots+'名';
  renderGrid();
}
function save(){
  people.forEach(p=>{
    const el=document.getElementById('pr-'+p.id);
    if(el)p.profile=el.value;
  });
}
function renderGrid(){
  let html='';
  people.forEach(p=>{
    html+=`<div class="pcard">
      <div class="pcard-top">
        <div class="pav">${p.av}</div>
        <div class="pinfo">
          <div class="pname">${p.name}</div>
          <div class="pbasic">${p.age}歳・${p.g}性<span class="tag ${p.school.c}">${p.school.l}</span></div>
        </div>
        <button class="del-btn" onclick="deletePerson(${p.id})">✕</button>
      </div>
      <div class="field-label">人物・エピソード・生活スタイルなど</div>
      <div class="field-hint">職歴・スキルだけでなく、日常の過ごし方・趣味・価値観・ダラダラした話など何でもOK</div>
      <textarea id="pr-${p.id}" placeholder="例：大学卒業後3年間フリーターをしていた。毎日ゲームして過ごしていたが、あるゲームのバグを発見してコミュニティに報告したことがきっかけでプログラミングに興味を持った...">${p.profile}</textarea>
    </div>`;
  });
  html+=`<div class="add-card" onclick="addPerson()"><span style="font-size:22px">＋</span><span>応募者を追加</span></div>`;
  document.getElementById('pgrid').innerHTML=html;
}
function deletePerson(id){
  save();
  people=people.filter(p=>p.id!==id);
  renderGrid();
}
function addPerson(){
  save();
  people.push(genPerson(Date.now()));
  renderGrid();
}
function buildPrompt(){
  const s=scenarios[scen];
  const list=people.map((p,i)=>{
    const profile=p.profile.trim()||'（未入力）';
    return `【応募者${i+1}】${p.name}（${p.age}歳・${p.g}性・${p.school.l}）\n${profile}`;
  }).join('\n\n');
  return `あなたは採用面接官AIです。以下の企業・求人情報と応募者の人物情報をもとに、面接シミュレーションと採用判断を行ってください。\n\n【企業・求人情報】\n${s.title}\n${s.desc}\n採用枠：${s.slots}名（応募者${people.length}名中）\n\n【応募者情報】\n${list}\n\n各応募者について以下を行ってください：\n1. 面接で実際に聞くであろう質問を2〜3個\n2. その人物のどこを評価・懸念するか\n\nそして最後に採用する${s.slots}名を決定し、「今回の"優秀さ"の定義」を明示してください。`;
}
document.getElementById('judgeBtn').addEventListener('click',()=>{
  save();
  const prompt=buildPrompt();
  const url='https://claude.ai/new?q='+encodeURIComponent(prompt);
  window.open(url,'_blank');
});
document.getElementById('regenBtn').addEventListener('click',()=>reset());
renderTabs();
reset();
</script>
</body>
</html>
